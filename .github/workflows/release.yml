name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag to build and release
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build release archives
    runs-on: macos-15
    env:
      # Signing is optional: without these secrets the macOS app is ad-hoc
      # signed and not notarized.
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version tag: $VERSION" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lifx-onboard-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS app
        run: |
          set -euo pipefail
          archive="lifx-onboard_${VERSION}_darwin_universal"
          staging="$RUNNER_TEMP/$archive"
          mkdir -p "$staging" dist

          ARCHS="arm64 amd64" VERSION="$VERSION" OUT_DIR="$staging" \
            SIGN_IDENTITY="${MACOS_SIGNING_IDENTITY:--}" scripts/bundle.sh

          if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            # Notarize, then staple the ticket to the app so it opens
            # offline without Gatekeeper warnings.
            submission="$RUNNER_TEMP/notarize.zip"
            ditto -c -k --keepParent "$staging/LifxOnboard.app" "$submission"
            xcrun notarytool submit "$submission" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --output-format json > "$RUNNER_TEMP/notary.json"
            status="$(/usr/bin/plutil -extract status raw "$RUNNER_TEMP/notary.json")"
            if [[ "$status" != "Accepted" ]]; then
              id="$(/usr/bin/plutil -extract id raw "$RUNNER_TEMP/notary.json")"
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
              echo "notarization failed: $status" >&2
              exit 1
            fi
            xcrun stapler staple "$staging/LifxOnboard.app"
            spctl --assess --type execute --verbose=2 "$staging/LifxOnboard.app"
          else
            echo "::warning::No signing secrets; the macOS app is ad-hoc signed and not notarized."
          fi

          cp LICENSE README.md "$staging/"
          ditto -c -k --keepParent "$staging" "dist/${archive}.zip"

      - name: Build Linux and Windows archives
        run: |
          set -euo pipefail
          while read -r goos goarch goarm label; do
            archive="lifx-onboard_${VERSION}_${goos}_${label}"
            staging_root="$(mktemp -d)"
            package_dir="${staging_root}/${archive}"
            mkdir -p "$package_dir"

            binary="${package_dir}/lifx-onboard"
            [[ "$goos" == "windows" ]] && binary="${binary}.exe"

            build_env=(env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch")
            [[ "$goarm" != "none" ]] && build_env+=(GOARM="$goarm")
            "${build_env[@]}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$binary" \
              ./cmd/lifx-onboard

            cp LICENSE README.md "$package_dir/"
            if [[ "$goos" == "windows" ]]; then
              (cd "$staging_root" && zip -qr "${GITHUB_WORKSPACE}/dist/${archive}.zip" "$archive")
            else
              tar -C "$staging_root" -czf "dist/${archive}.tar.gz" "$archive"
            fi
          done <<'TARGETS'
          linux amd64 none amd64
          linux arm64 none arm64
          linux arm 7 armv7
          windows amd64 none amd64
          windows arm64 none arm64
          TARGETS

          (cd dist && shasum -a 256 lifx-onboard_* > SHA256SUMS)

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: lifx-onboard-release
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: lifx-onboard-release
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$VERSION" dist/* \
              --draft \
              --generate-notes \
              --repo "$GH_REPO" \
              --title "lifx-onboard $VERSION" \
              --verify-tag
          fi
